[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "1.0.0"
description = "Vietnamese document QA chatbot: Google ADK agent + LlamaIndex hybrid RAG with citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-adk>=2.4,<3",
    "llama-index-core>=0.14.23,<0.15",
    "llama-index-llms-google-genai>=0.9.6",
    "llama-index-embeddings-google-genai>=0.5.1",
    "llama-index-readers-file>=0.6.0",
    "llama-index-retrievers-bm25>=0.9.0",
    "pypdf>=6.0",
    "docx2txt>=0.9",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
ollama = [
    "llama-index-llms-ollama>=0.10",
    "llama-index-embeddings-ollama>=0.9",
]
qdrant = [
    "qdrant-client>=1.12",
    "llama-index-vector-stores-qdrant>=0.11",
]
ui = ["streamlit>=1.40"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
docqa = "docqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "storage", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header"]
