name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # NLTK >= 3.10.4 refuses data in directories writable by other accounts, which includes the
      # runner's shared site-packages (where LlamaIndex bundles it); use a private copy instead.
      NLTK_DATA: /home/runner/nltk_data
    strategy:
      fail-fast: false  # report every Python version instead of cancelling the others
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: NLTK data (sentence tokenizer used by the splitters)
        run: python -m nltk.downloader -q -d "$NLTK_DATA" stopwords punkt_tab
      - name: Lint
        run: ruff check src tests agents ui scripts && ruff format --check src tests agents ui scripts
      - name: Test (offline, no API key needed)
        shell: bash
        run: |
          set +e
          pytest -q -rfE --junitxml=junit.xml 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # Surface each failure with the end of its traceback as a public annotation
          # (job logs need sign-in to read, annotations do not).
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("junit.xml").iter("testcase"):
              for problem in list(case.findall("failure")) + list(case.findall("error")):
                  tail = (problem.text or problem.get("message") or "").strip().splitlines()[-25:]
                  body = "%0A".join(line.replace("%", "%25") for line in tail)[:3500]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{body}")
          PY
          exit $status

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t docqa:ci .
