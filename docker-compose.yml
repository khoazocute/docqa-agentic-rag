services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build: .
    env_file: .env
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - docqa-storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
      DOCQA_API_KEY: ${DOCQA_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  docqa-storage:
  qdrant-data:
